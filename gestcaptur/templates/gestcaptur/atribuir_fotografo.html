<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="fotografo_id" class="form-label">Selecionar Fotógrafo:</label>
                <select name="fotografo_id" id="fotografo_id" class="form-select">
                    <option value="">-- Nenhum Fotógrafo --</option> {# Opção para desatribuir #}
                    {% for fotografo in fotografos %}
                        <option value="{{ fotografo.id }}" {% if fotografo_atual and fotografo.id == fotografo_atual.id %}selected{% endif %}>
                            {{ fotografo.first_name }} {{ fotografo.last_name }} ({{ fotografo.username }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Atribuir Fotógrafo</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
        </form>

        <script src="" async defer></script>
    </body>
</html>
